name: QuotaBar
options:
  bundleIdPrefix: com.zyd
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  QuotaBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/QuotaBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyd.quotabar
        PRODUCT_NAME: QuotaBar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: QuotaBar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
  QuotaBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/QuotaBarTests
    dependencies:
      - target: QuotaBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyd.quotabar.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QuotaBar:
    build:
      targets:
        QuotaBar: all
        QuotaBarTests: [test]
    test:
      targets:
        - QuotaBarTests
